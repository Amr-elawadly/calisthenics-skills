    body {

      color: #fff;

.settings-icon {
  position: fixed;
  top: 20px;
  right: 20px;

  color: white;
  padding: 12px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 1000;

  transition: transform 0.3s ease;
  font-size: 24px;
}

body.light-mode .settings-icon{
  color: black;
}

.settings-icon:hover {
  transform: rotate(90deg);
}


.settings-menu {
  position: fixed;
  top: 60px;
  right: 20px;
  background: #333;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
  width: 200px;
  display: none; 
  z-index: 999;
}

.setting-item {
  color: white;
  margin: 10px 0;
  cursor: pointer;
}

.setting-item:hover {
  color: crimson;
}


body.light-mode {
  background-color: white;
  /* background-image:url(pexels-philippedonn-1169754.jpg);
  background-size: cover;

}

body.dark-mode {

    header {

    .social-icons {

.social-icons img {
  width: 40px;
  filter: grayscale(100%) brightness(2);

.social-icons img:hover {

    nav {

    .card {
  opacity: 0;
  transform: translateY(50px);
  animation: fadeInUp 0.8s ease forwards;
}

.card:nth-child(1) {
  animation-delay: 0.2s;
}
.card:nth-child(2) {
  animation-delay: 0.4s;
}
.card:nth-child(3) {
  animation-delay: 0.6s;
}
.card:nth-child(4) {
  animation-delay: 0.8s;
}
.card:nth-child(5) {
  animation-delay: 1s;
}

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}


    .card {
      display: flex;
      background: #1a1a1a;
      border-radius: 15px;
      overflow: hidden;
      margin: 30px auto;
      max-width: 1000px;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
      transition: 0.3s;
    }

    .card:hover {
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
    }

    .card img {
      width: 300px;
      height: auto;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.08);
    }

    .description {
      flex: 1;
      padding: 30px;
      display: flex;
      align-items: center;
      position: relative;
      background: #222;
    }

    .type-text {
      font-size: 16px;
      line-height: 1.6;
      white-space: pre-line;
      min-height: 120px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    @media (max-width: 768px) {
      .card {
        flex-direction: column;
      }

      .card img {
        width: 100%;
      }

      .description {
        padding: 20px;
      }

      .type-text {
        font-size: 14px;
      }
    }

    

    section {

      align-items: center;
      justify-content: center;

video {

video.show {

    .text-box {

    .text-box.hidden-box {

}

.text-box.show-box {

  <script>
    const typingTimers = new WeakMap();

    function startTyping(card, text) {
      const el = card.querySelector(".type-text");
      let i = 0;
      el.innerHTML = "";
      el.style.opacity = 1;

      function typeChar() {
        if (i < text.length) {
          el.innerHTML += text.charAt(i);
          i++;
          const timer = setTimeout(typeChar, 5);
          typingTimers.set(el, timer);
        }
      }
      typeChar();
    }

  const revealElements = document.querySelectorAll('.reveal');

  function revealOnScroll() {
    const windowHeight = window.innerHeight;

    revealElements.forEach(el => {
      const elementTop = el.getBoundingClientRect().top;
      if (elementTop < windowHeight - 100) {
        el.classList.add('active');
      }
    });
  }

  window.addEventListener('scroll', revealOnScroll);
  window.addEventListener('load', revealOnScroll);



  const text = `Calisthenics is bodyweight training that builds strength, control, and mobility without equipment.

It improves balance, flexibility, and coordination through powerful movements like planches, levers, and handstands.

Train anywhere. Master your body. Build real strength.`;

    const typingTarget = document.getElementById("typing-text");
    let i = 0;

    function typeChar() {
      if (i < text.length) {
        typingTarget.textContent += text.charAt(i);
        i++;
        setTimeout(typeChar, 15); 
      }
    }

    window.addEventListener("load", () => {
      setTimeout(typeChar, 500); 
    });

  window.addEventListener("load", () => {
    const video = document.getElementById("intro-video");
    video.classList.add("show"); 

    const textBox = document.querySelector(".text-box");
    textBox.classList.add("show-box");
  });


  
function toggleSettingsMenu() {
  const menu = document.querySelector('.settings-menu');
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}


function toggleDarkMode() {
  const body = document.body;
  body.classList.toggle('dark-mode');
  body.classList.toggle('light-mode');
}



  </script>
